<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kontak Kami - EcoCycle</title>

    <!-- CSS Eksternal -->
    <link rel="stylesheet" href="contact.css">
</head>
<body>

<section class="contact-section">

    <!-- JUDUL -->
    <div class="contact-header">
        <h1>Kontak Kami</h1>
        <p>
            Kalau ada saran dan pertanyaan, langsung aja kirim
            pesan di bawah ini ya.
        </p>
    </div>

    <!-- FORM KONTAK -->
    <div class="contact-box">

        <form class="contact-form">

            <input
                type="text"
                placeholder="Nama Kamu"
                name="nama"
                required
            >

            <input
                type="email"
                placeholder="Email Kamu"
                name="email"
                required
            >

            <textarea
                placeholder="Tulis pesan kamu di sini..."
                name="pesan"
                required
            ></textarea>

            <a
                href="https://wa.me/62XXXXXXXXXX"
                class="whatsapp-button"
                target="_blank"
            >
                Kirim pesan via WhatsApp
                <span>→</span>
            </a>

        </form>

    </div>

</section>

</body>
</html>
